<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body{
      display: grid;
      place-items: center;
      height: 100vh;
      background-color: hsl(0, 0%, 8%);
      font-family: "Inter",Arial, Helvetica, sans-serif;
    }
    .card{
      margin: 0px;
      width: 20vw;
      height: auto;
      border: 1px solid hsl(0, 0%, 12%);
      border-radius: 10px;
      background-color: hsl(0, 0%, 12%);
      color: hsl(0, 0%, 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
img{
  padding-top: 30px;
  border-radius: 50%;
  width: 80px;
  height: auto;
}
#name{
  font-size: 1.5rem;
  font-weight: bolder;
  margin-bottom: 0px;
}
#location{
  color: hsl(75, 94%, 57%);
}
    #social-btn{
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }
    /* style both link-buttons and real buttons inside the container */
    #social-btn .btn,
    #social-btn button{
      padding: 10px;
      border-radius: 8px;
      background-color: hsl(0, 0%, 20%);
      border: none;
      font-weight: 700;
      color: hsl(0, 0%, 100%);
      text-decoration: none;
      display: inline-block;
      width: 100%;
      text-align: center;
      cursor: pointer;
    }
    #social-btn .btn:hover,
    #social-btn button:hover{
      background-color: hsl(75, 94%, 57%);
      color: hsl(0, 0%, 0%);
    }
  @media (max-width: 600px) {
  body {
    padding: 16px;
  }

  .card {
    width: min(90vw, 360px);
    padding: 24px;
    border-radius: 16px;
  }

  img {
    width: 120px;
  }

  #social-btn {
    gap: 16px;
  }
}
  </style>
</head>
<body>
<section class="card">
<img src="assets/images/profile.webp" alt="Profile photo of Munish Kumar Sharma">
<p id="name">Munish Kumar Sharma</p>
<p id="location">Himachal Pradesh,India</p>
<p id="role">"Front-end developer and avid reader."</p>
<div id="social-btn">
  <a id="github" class="btn" target="_blank" rel="noopener noreferrer" href="https://github.codewithmishu.in/">GitHub</a>
  <a id="mentor-btn" class="btn" target="_blank" rel="noopener noreferrer" href="https://www.frontendmentor.io/profile/CodeWithMishu">Frontend Mentor</a>
  <a id="linkedin" class="btn" target="_blank" rel="noopener noreferrer" href="https://www.linkedin.com/in/codewithmishu/">LinkedIn</a>
  <a id="twitter" class="btn" target="_blank" rel="noopener noreferrer" href="https://x.com/CodeWithMishu">Twitter</a>
  <a id="instagram" class="btn" target="_blank" rel="noopener noreferrer" href="https://instagram.com/codewithmishu">Instagram</a>
</div>
</section>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://codewithmishu.in/">Munish Kumar Sharma</a>.
  </footer>
</body>
</html>
